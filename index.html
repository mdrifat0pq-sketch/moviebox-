<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flixora | Premium Stream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #000; color: white; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Netflix Style Slider */
        .movie-row { display: flex; overflow-x: auto; gap: 14px; padding: 10px 20px; scrollbar-width: none; }
        .movie-row::-webkit-scrollbar { display: none; }
        .movie-card { min-width: 115px; width: 115px; cursor: pointer; transition: transform 0.3s; }
        .movie-card:active { transform: scale(0.95); }
        .poster-wrapper { aspect-ratio: 2/3; border-radius: 6px; overflow: hidden; background: #141414; margin-bottom: 6px; border: 1px solid #222; }
        .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .movie-title { font-size: 11px; font-weight: 600; text-align: center; color: #b3b3b3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 32px; }

        /* Netflix Immersive Hero Banner */
        #heroSection { position: relative; width: 100%; height: 45vh; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 20px; }
        #heroSection::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, #000 10%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.7) 100%); }
        .hero-content { position: relative; z-index: 10; max-width: 90%; }

        /* Navigation */
        nav { background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%); }

        /* Subtitle Engine Display Box */
        .sub-overlay { position: absolute; bottom: 18%; left: 0; right: 0; text-align: center; z-index: 10005; pointer-events: none; }
        .sub-text { background: rgba(0, 0, 0, 0.8); color: #ffffff; padding: 8px 18px; border-radius: 6px; font-size: 16px; font-weight: bold; display: inline-block; max-width: 85%; border: 1px solid rgba(255,255,255,0.15); text-shadow: 1px 1px 3px #000; }
        .sub-status { color: #E50914; font-size: 10px; font-weight: bold; margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; }

        /* Branding */
        .player-watermark { position: absolute; top: 12%; right: 5%; text-align: center; z-index: 10002; pointer-events: none; }
        .watermark-logo { width: 32px; height: 32px; object-fit: contain; }

        #detailsModal { position: fixed; inset: 0; z-index: 9000; background: #000; overflow-y: auto; display: none; }
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 10px; margin-top: 20px; }
        .ep-btn { background: #181818; padding: 14px; border-radius: 6px; text-align: center; font-size: 13px; font-weight: bold; border: 1px solid #262626; }
        
        .cat-scroll { display: flex; overflow-x: auto; gap: 8px; padding: 15px 20px; scrollbar-width: none; }
        .cat-scroll::-webkit-scrollbar { display: none; }
        .cat-tab { white-space: nowrap; padding: 6px 16px; border-radius: 20px; background: #222; font-size: 11px; font-weight: bold; cursor: pointer; border: 1px solid #333; }
        .cat-tab.active { background: #E50914; border-color: #E50914; }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 flex items-center justify-between px-5 py-4 transition-all duration-300">
        <h1 class="text-xl font-black text-[#E50914] tracking-tighter">FLIXORA</h1>
        <div class="flex items-center gap-5">
            <i class="fa fa-search text-lg cursor-pointer" onclick="toggleSearch()"></i>
            <img class="w-7 h-7 object-contain" src="https://i.ibb.co.com/RkpHQDFp/file-00000000a76c7209afe66a306f119a83.png" alt="Profile">
        </div>
    </nav>

    <div>
        <div id="searchBox" class="px-5 pt-20 pb-2 hidden bg-black">
            <input id="searchInput" type="text" placeholder="Search movies, K-Drama..." class="w-full bg-[#111] p-3 rounded-lg border border-red-600/30 outline-none text-white text-sm">
        </div>

        <div id="heroSection" style="background-image: url('https://image.tmdb.org/t/p/original/wwemzKWzjKYJFfCeiBwM8n46I7F.jpg');">
            <div class="hero-content">
                <h2 id="heroTitle" class="text-2xl font-black mb-2 text-white drop-shadow-md">Loading Spotlight...</h2>
                <p id="heroDesc" class="text-gray-300 text-xs line-clamp-2 mb-4 max-w-sm drop-shadow"></p>
                <button id="heroPlayBtn" class="bg-white text-black font-bold text-xs px-5 py-2.5 rounded flex items-center gap-2 shadow-lg"><i class="fa fa-play"></i> Play</button>
            </div>
        </div>

        <div class="cat-scroll">
            <div class="cat-tab active" onclick="filterCat('all', this)">All</div>
            <div class="cat-tab" onclick="filterCat('romantic-k', this)">K-Drama</div>
            <div class="cat-tab" onclick="filterCat('romantic-c', this)">C-Drama</div>
        </div>

        <h3 id="rowTitle" class="px-5 mt-4 font-bold text-xs uppercase tracking-widest text-red-600">Trending Now</h3>
        <div id="movieGrid" class="movie-row"></div>
    </div>

    <div id="detailsModal">
        <div class="p-6 pt-24 max-w-xl mx-auto">
            <button onclick="closeDetails()" class="fixed top-6 right-6 text-3xl text-white/60"><i class="fa fa-times-circle"></i></button>
            <img id="detBackdrop" class="w-full h-56 object-cover rounded-2xl mb-5 shadow-2xl border border-white/10">
            <h2 id="detTitle" class="text-2xl font-black mb-2"></h2>
            <p id="detDesc" class="text-gray-400 text-xs leading-relaxed mb-6"></p>
            <h3 class="text-xs font-bold uppercase border-l-4 border-red-600 pl-3 mb-4">Select Episode</h3>
            <div id="epGrid" class="ep-grid pb-20"></div>
        </div>
    </div>

    <div id="player" class="fixed inset-0 bg-black z-[9999] hidden">
        <div class="player-watermark">
            <img class="watermark-logo shadow-lg" src="https://i.ibb.co.com/RkpHQDFp/file-00000000a76c7209afe66a306f119a83.png">
        </div>
        
        <div class="sub-overlay">
            <div id="subContainer" class="sub-text">বাংলা ইঞ্জিন সাবটাইটেল ট্র্যাক রেডি করছে...</div>
            <div class="sub-status">● Live Real-Time Subtitle Translation</div>
        </div>

        <button onclick="closePlayer()" class="absolute top-6 left-6 z-[10001] text-2xl drop-shadow-md text-white"><i class="fa fa-chevron-left"></i></button>
        <iframe id="videoFrame" class="w-full h-full" allowfullscreen frameborder="0" referrerpolicy="no-referrer"></iframe>
    </div>

    <script src="subtitle-engine.js"></script>
    <script>
        const KEY = '2d2caca374aecd4dbd0f66adb29dd554';
        const IMG = 'https://image.tmdb.org/t/p/w342';

        function toggleSearch() {
            const box = document.getElementById('searchBox');
            box.classList.toggle('hidden');
        }

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            if(e.key === 'Enter') search(e.target.value);
        });

        async function search(q) {
            const r = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${KEY}&query=${q}`);
            const d = await r.json();
            document.getElementById('rowTitle').innerText = "Search Results";
            render(d.results);
        }

        // Auto-loads an interactive dynamic hero card
        async function loadHeroBanner(item) {
            if(!item) return;
            document.getElementById('heroSection').style.backgroundImage = `url('https://image.tmdb.org/t/p/original${item.backdrop_path || item.poster_path}')`;
            document.getElementById('heroTitle').innerText = item.title || item.name;
            document.getElementById('heroDesc').innerText = item.overview || "";
            document.getElementById('heroPlayBtn').onclick = () => openDetails(item.id, item.media_type || 'movie');
        }

        async function filterCat(cat, el) {
            document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            let url = `https://api.themoviedb.org/3/trending/all/week?api_key=${KEY}`;
            if(cat === 'romantic-k') url = `https://api.themoviedb.org/3/discover/tv?api_key=${KEY}&with_genres=18&with_original_language=ko`;
            if(cat === 'romantic-c') url = `https://api.themoviedb.org/3/discover/tv?api_key=${KEY}&with_genres=18&with_original_language=zh`;
            
            const r = await fetch(url);
            const d = await r.json();
            document.getElementById('rowTitle').innerText = el.innerText;
            render(d.results, cat.includes('romantic') ? 'tv' : 'movie');
            if(d.results.length > 0 && cat === 'all') loadHeroBanner(d.results[0]);
        }

        function render(list, type) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = list.filter(m => m.poster_path).map(m => `
                <div class="movie-card" onclick="openDetails('${m.id}', '${m.media_type || type || 'movie'}')">
                    <div class="poster-wrapper"><img src="${IMG + m.poster_path}"></div>
                    <div class="movie-title">${m.title || m.name}</div>
                </div>
            `).join('');
        }

        async function openDetails(id, type) {
            const r = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${KEY}`);
            const d = await r.json();
            document.getElementById('detTitle').innerText = d.name || d.title;
            document.getElementById('detDesc').innerText = d.overview ? d.overview.substring(0, 160) + '...' : '';
            document.getElementById('detBackdrop').src = `https://image.tmdb.org/t/p/w780${d.backdrop_path || d.poster_path}`;
            
            const grid = document.getElementById('epGrid'); grid.innerHTML = '';
            if(type === 'tv') {
                // Fetching real total episode counters
                const sR = await fetch(`https://api.themoviedb.org/3/tv/${id}/season/1?api_key=${KEY}`);
                const sD = await sR.json();
                if(sD.episodes) {
                    sD.episodes.forEach(e => {
                        grid.innerHTML += `<div class="ep-btn" onclick="play('${id}', 'tv', 1, ${e.episode_number})">Ep ${e.episode_number}</div>`;
                    });
                }
            } else {
                grid.innerHTML = `<div class="ep-btn col-span-full" onclick="play('${id}', 'movie')">Watch Full Movie</div>`;
            }
            document.getElementById('detailsModal').style.display = 'block';
        }

        function play(id, type, s=1, e=1) {
            document.getElementById('player').classList.remove('hidden');
            
            // MULTI-SERVER FALLBACK SYSTEM (যদি একটা সার্ভার ব্লক করে বা না চলে, অন্যটা ট্রাই করবে)
            // সার্ভার ১ (vidsrc.pm) এবং সার্ভার ২ (vidsrc.to বা vidsrc.xyz) ব্যাকআপ করা হলো
            let mainSrc = `https://vidsrc.pm/embed/${type}/${id}`;
            if(type === 'tv') mainSrc += `/${s}/${e}`;
            
            const frame = document.getElementById('videoFrame');
            frame.src = mainSrc;

            // সাবটাইটেল ইঞ্জিন চালু করা
            initSubtitleEngine(id, type, s, e);
        }

        function closeDetails() { document.getElementById('detailsModal').style.display = 'none'; }
        function closePlayer() { 
            document.getElementById('player').classList.add('hidden'); 
            document.getElementById('videoFrame').src = ''; 
            clearSubtitleEngine();
        }

        filterCat('all', document.querySelector('.cat-tab'));
    </script>
</body>
    </html>
