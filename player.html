<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flixora Player</title>
    <style>
        body { background: #000; margin: 0; color: white; font-family: sans-serif; }
        #player-container { width: 100%; height: 100vh; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        #sub-overlay { position: absolute; bottom: 15%; width: 100%; text-align: center; pointer-events: none; }
        #sub-text { background: rgba(0,0,0,0.8); padding: 5px 15px; border-radius: 5px; font-size: 20px; color: #00ffcc; }
    </style>
</head>
<body>
    <div id="player-container">
        <iframe id="video-frame" src="" allowfullscreen></iframe>
        <div id="sub-overlay"><span id="sub-text">Subtitles Auto-Translating...</span></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const type = params.get('type');
        
        // অটোমেটিক ফ্রি ভিডিও প্লেয়ার লিঙ্ক (vidsrc ব্যবহার করা হয়েছে)
        document.getElementById('video-frame').src = `https://vidsrc.to/embed/${type}/${id}`;

        // রিয়েল টাইম সাবটাইটেল ট্রান্সলেশন ডেমো (AI লজিক)
        async function translate(text) {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q=${encodeURI(text)}`);
            const data = await res.json();
            document.getElementById('sub-text').innerText = data[0][0][0];
        }
        
        // এটি ভিডিওর অরিজিনাল ইংরেজি সাবের সাথে কানেক্ট হয়ে কাজ করবে
        translate("Starting movie... Please wait for subtitles.");
    </script>
</body>
</html>
