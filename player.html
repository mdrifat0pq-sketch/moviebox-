<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming - Flixora</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
        /* অ্যাড ব্লক করার জন্য এবং ভিডিও ফুল স্ক্রিন রাখার জন্য */
        .video-wrapper { position: relative; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
        #sub-layer {
            position: absolute; bottom: 12%; width: 100%; text-align: center;
            z-index: 999; pointer-events: none;
        }
        #bn-text {
            background: rgba(0,0,0,0.75); color: #00ffcc;
            padding: 5px 15px; border-radius: 5px; font-size: 19px;
            font-family: sans-serif; display: inline-block;
        }
    </style>
</head>
<body>

<div class="video-wrapper">
    <iframe id="player" src="" 
            sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation" 
            allowfullscreen></iframe>
    
    <div id="sub-layer"><span id="bn-text">Subtitle Engine Ready...</span></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const type = params.get('type');
    
    // ভিডিও সোর্স সেটআপ
    const iframe = document.getElementById('player');
    iframe.src = `https://vidsrc.me/embed/${type}/${id}`;

    // রিয়েল টাইম ট্রান্সলেশন লজিক
    async function translateText(text) {
        if (!text || text.length < 2) return;
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q=${encodeURI(text)}`);
            const data = await res.json();
            document.getElementById('bn-text').innerText = data[0][0][0];
        } catch (e) { console.log("Translation Error"); }
    }

    // যেহেতু অরিজিনাল ভিডিও সোর্স থেকে সরাসরি টেক্সট ধরা কঠিন, 
    // আমরা একটি ইন্টারভাল দিয়ে ডেমো ট্রান্সলেশন দেখাচ্ছি। 
    // অরিজিনাল সাবটাইটেল ইনজেকশন অনেক সময় সোর্স ওয়েবসাইট ব্লক করে দেয়।
    window.addEventListener('message', function(event) {
        // এখানে সোর্স থেকে সাবটাইটেল ডাটা রিসিভ করার চেষ্টা করা হয়
        // অনেক ওপেন সোর্স সোর্স এটি ব্লক রাখে সিকিউরিটির জন্য।
    });
</script>
</body>
</html>
