<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flixora - Auto Stream</title>
    <style>
        body { background: #0b0f19; color: white; font-family: sans-serif; margin: 0; padding: 10px; }
        .header { font-size: 24px; font-weight: bold; color: #00d4ff; text-align: center; padding: 20px; }
        .movie-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card { background: #1c222d; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .info { padding: 8px; font-size: 14px; text-align: center; }
        .rating { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.7); color: gold; padding: 2px 5px; border-radius: 3px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">FLIXORA</div>
    <div class="movie-grid" id="movie-list"></div>

    <script>
        const API_KEY = "2d2caca374aecd4dbd0f66adb29dd554";
        // সরাসরি চাইনিজ এবং কোরিয়ান ড্রামাগুলো খোঁজার লিঙ্ক
        const TMDB_URL = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_original_language=zh|ko&sort_by=popularity.desc`;

        async function loadMovies() {
            const res = await fetch(TMDB_URL);
            const data = await res.json();
            const container = document.getElementById('movie-list');

            data.results.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => window.location.href = `player.html?id=${item.id}&type=tv`;
                card.innerHTML = `
                    <div class="rating">⭐ ${item.vote_average}</div>
                    <img src="https://image.tmdb.org/t/p/w500${item.poster_path}">
                    <div class="info">${item.name}</div>
                `;
                container.appendChild(card);
            });
        }
        loadMovies();
    </script>
</body>
</html>
