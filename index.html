<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flixora - Premium</title>
    <style>
        :root { --main-color: #e50914; --bg-color: #0b0f19; }
        body { background: var(--bg-color); color: white; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Navbar */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 4%; background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%); position: fixed; width: 92%; z-index: 100; }
        .logo { font-size: 28px; font-weight: bold; color: var(--main-color); letter-spacing: 1px; }
        .search-bar { background: rgba(255,255,255,0.1); border: 1px solid #444; color: white; padding: 5px 15px; border-radius: 20px; outline: none; }

        /* Hero Banner */
        .hero { height: 70vh; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding-bottom: 50px; position: relative; }
        .hero::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(to top, var(--bg-color), transparent); }
        .hero-content { position: relative; z-index: 1; padding: 0 4%; }
        .hero-title { font-size: 40px; margin-bottom: 10px; }

        /* Rows */
        .row { padding: 20px 4%; }
        .row-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #ccc; }
        .movie-list { display: flex; overflow-x: scroll; gap: 10px; scrollbar-width: none; }
        .movie-list::-webkit-scrollbar { display: none; }
        .posters { min-width: 130px; height: 190px; border-radius: 5px; transition: transform 0.3s; cursor: pointer; object-fit: cover; }
        .posters:hover { transform: scale(1.1); z-index: 10; }

        /* Category Buttons */
        .categories { display: flex; gap: 10px; padding: 80px 4% 0; overflow-x: auto; scrollbar-width: none; }
        .cat-btn { background: #222; border: 1px solid #444; color: white; padding: 8px 15px; border-radius: 5px; white-space: nowrap; cursor: pointer; }
        .cat-btn:hover { background: var(--main-color); }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">FLIXORA</div>
        <input type="text" class="search-bar" placeholder="Search..." onkeyup="searchMovies(this.value)">
    </div>

    <div class="hero" id="hero-banner">
        <div class="hero-content">
            <h1 class="hero-title" id="hero-name">Loading...</h1>
            <button class="cat-btn" style="background: white; color: black; font-weight: bold;">▶ Play</button>
        </div>
    </div>

    <div class="categories">
        <div class="cat-btn" onclick="fetchByGenre('zh', 'romantic', 'tv')">Chinese Romantic</div>
        <div class="cat-btn" onclick="fetchByGenre('ko', 'romantic', 'tv')">Korean Romantic</div>
        <div class="cat-btn" onclick="fetchByGenre('zh', 'action', 'movie')">Chinese Action</div>
        <div class="cat-btn" onclick="fetchByGenre('id', 'horror', 'movie')">Indo Horror</div>
    </div>

    <div class="row">
        <div class="row-title">Trending Now</div>
        <div class="movie-list" id="trending-list"></div>
    </div>

    <script>
        const API_KEY = "2d2caca374aecd4dbd0f66adb29dd554";
        const IMG_PATH = "https://image.tmdb.org/t/p/original";

        async function initApp() {
            // Hero Banner load
            const res = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}`);
            const data = await res.json();
            const hero = data.results[0];
            document.getElementById('hero-banner').style.backgroundImage = `url(${IMG_PATH + hero.backdrop_path})`;
            document.getElementById('hero-name').innerText = hero.title || hero.name;

            // Trending List
            const list = document.getElementById('trending-list');
            data.results.forEach(m => {
                const img = document.createElement('img');
                img.className = 'posters';
                img.src = `https://image.tmdb.org/t/p/w500${m.poster_path}`;
                img.onclick = () => window.location.href = `player.html?id=${m.id}&type=${m.media_type}`;
                list.appendChild(img);
            });
        }

        async function fetchByGenre(lang, genre, type) {
            // এখানে ক্যাটাগরি অনুযায়ী ডাটা ফিল্টার হবে (simplified logic)
            const res = await fetch(`https://api.themoviedb.org/3/discover/${type}?api_key=${API_KEY}&with_original_language=${lang}&sort_by=popularity.desc`);
            const data = await res.json();
            const list = document.getElementById('trending-list');
            list.innerHTML = ""; 
            data.results.forEach(m => {
                const img = document.createElement('img');
                img.className = 'posters';
                img.src = `https://image.tmdb.org/t/p/w500${m.poster_path}`;
                img.onclick = () => window.location.href = `player.html?id=${m.id}&type=${type}`;
                list.appendChild(img);
            });
        }

        initApp();
    </script>
</body>
    </html>
