<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flixora Premium</title>
    <style>
        :root { --main-red: #e50914; --bg-black: #05080f; }
        body { background: var(--bg-black); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(0,0,0,0.8); position: fixed; width: 90%; z-index: 1000; }
        .logo { font-size: 26px; font-weight: bold; color: var(--main-red); }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 100px 5% 20px; }
        .card { position: relative; border-radius: 8px; overflow: hidden; transition: 0.3s; cursor: pointer; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 210px; object-fit: cover; }
        .card-info { padding: 8px; font-size: 13px; text-align: center; background: #161b22; }
        .cats { display: flex; overflow-x: auto; gap: 10px; padding: 70px 5% 0; scrollbar-width: none; }
        .cat-btn { background: #21262d; border: none; color: white; padding: 8px 16px; border-radius: 20px; white-space: nowrap; cursor: pointer; }
        .cat-btn.active { background: var(--main-red); }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">FLIXORA</div>
    <input type="text" placeholder="Search..." id="search" style="border-radius:20px; padding:5px 10px; border:none;">
</div>

<div class="cats">
    <button class="cat-btn active" onclick="loadMovies('zh', 'tv')">Chinese Romantic</button>
    <button class="cat-btn" onclick="loadMovies('ko', 'tv')">Korean Drama</button>
    <button class="cat-btn" onclick="loadMovies('zh', 'movie')">Chinese Action</button>
    <button class="cat-btn" onclick="loadMovies('id', 'movie', '27')">Indo Horror</button>
</div>

<div class="movie-grid" id="movie-list"></div>

<script>
    const API_KEY = "2d2caca374aecd4dbd0f66adb29dd554";
    
    async function loadMovies(lang = 'zh', type = 'tv', genre = '') {
        const url = `https://api.themoviedb.org/3/discover/${type}?api_key=${API_KEY}&with_original_language=${lang}&with_genres=${genre}&sort_by=popularity.desc&page=1`;
        const res = await fetch(url);
        const data = await res.json();
        const container = document.getElementById('movie-list');
        container.innerHTML = "";
        
        data.results.forEach(m => {
            container.innerHTML += `
                <div class="card" onclick="location.href='player.html?id=${m.id}&type=${type}'">
                    <img src="https://image.tmdb.org/t/p/w500${m.poster_path}">
                    <div class="card-info">${m.name || m.title}</div>
                </div>`;
        });
    }
    loadMovies(); // Default load
</script>
</body>
</html>
