<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing - Flixora</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .back-btn { position: absolute; top: 20px; left: 20px; color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 50%; text-decoration: none; z-index: 10; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">⬅</a>
    <iframe id="video-iframe" src="" allow="autoplay; fullscreen"></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const type = params.get('type') || 'movie';
        
        // Vidsrc বা সমজাতীয় সোর্স যা অটো-প্লে সাপোর্ট করে
        // এখানে সরাসরি এমবেড লিঙ্ক দেওয়া হলো
        const playerUrl = `https://vidsrc.to/embed/${type}/${id}?autoplay=1`;
        document.getElementById('video-iframe').src = playerUrl;
    </script>
</body>
</html>
